<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // ============================================================================
    // ERROR BOUNDARY FOR SAFE RENDERING
    // ============================================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || 'Unexpected rendering error' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#050507] text-white flex items-center justify-center p-6">
              <div className="max-w-md w-full rounded-2xl border border-rose-500/40 bg-[#0C0C10] p-6 space-y-3">
                <h2 className="text-lg font-bold text-rose-400">Preview Recovery</h2>
                <p className="text-xs text-zinc-300">{this.state.errorMessage}</p>
                <button
                  type="button"
                  onClick={() => {
                    localStorage.removeItem('afitamine_clients_v3');
                    window.location.reload();
                  }}
                  className="px-4 py-2 rounded-xl bg-white text-black text-xs font-bold"
                >
                  Reset & Reload App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ============================================================================
    // INLINE ICON SET (ZERO EXTERNAL ICON DEPENDENCY)
    // ============================================================================

            </svg>

        case 'pie':
          return (
            <svg {...common}>

    // ============================================================================
    // A.FITAMINE GEOMETRIC MONOGRAM LOGO
    // ============================================================================
    const AFitamineLogo = ({ className = 'w-10 h-10', variant = 'white' }) => (

        viewBox="0 0 220 260"

        />

    );

    const NAV_ITEMS = [
      { id: 'biometrics', label: 'Client Biometrics', shortLabel: 'Biometrics', icon: 'user', badge: '01' },
      { id: 'bmi', label: 'BMI & Weight Forecast', shortLabel: 'BMI & Forecast', icon: 'scale', badge: '02' },
      { id: 'metabolic', label: 'Metabolic Engine', shortLabel: 'Metabolic', icon: 'flame', badge: '03' },

    const ACTIVITY_MULTIPLIERS = {

    // ============================================================================
    // ELEGANT UI PRIMITIVES

    const SectionHeader = ({ number, title, subtitle, rightContent, ui, isBright }) => (

            <span
              className={`px-2.5 py-0.5 text-[10px] font-bold tracking-[0.18em] uppercase rounded-md ${
                isBright ? 'bg-zinc-900 text-zinc-50' : 'bg-zinc-100 text-zinc-950'
              }`}
            >
              Module {number}
            </span>
            <span className={`text-[11px] uppercase tracking-[0.22em] font-semibold ${ui.textSubtle}`}>
              A.FITAMINE Coaching Agent
            </span>
          </div>
          <h1 className={`text-2xl sm:text-3xl font-bold tracking-tight ${ui.heading}`}>
            {title}
          </h1>
          {subtitle && <p className={`text-sm mt-1.5 max-w-2xl leading-relaxed ${ui.textMuted}`}>{subtitle}</p>}
        </div>
        {rightContent && <div className="flex items-center gap-3">{rightContent}</div>}
      </div>
    );

    const InputField = ({ label, unit, type = 'number', value, onChange, step = 'any', min, max, ui, status }) => (
      <div className="flex flex-col gap-1.5">
        <label className={`text-xs font-medium tracking-wide flex justify-between ${ui.textMuted}`}>
          <span>{label}</span>
          {unit && <span className={`font-mono text-[11px] ${ui.textSubtle}`}>{unit}</span>}
        </label>
        <input
          type={type}
          value={value}
          step={step}
          min={min}
          max={max}
          onChange={(e) =>
            // Keep the user's in-progress input exactly as entered. Converting an
            // empty number field to 0 immediately makes browsers prepend that 0
            // when the user starts typing a replacement value.
            onChange(type === 'number' ? e.target.value : e.target.value)
          }
          className={`w-full px-3.5 py-2.5 rounded-xl border text-sm font-medium tabular-nums focus:outline-none transition-all ${status === 'healthy' ? '!border-emerald-500/70 !bg-emerald-500/10 !text-emerald-500 focus:!ring-1 focus:!ring-emerald-500' : status === 'unhealthy' ? '!border-rose-500/70 !bg-rose-500/10 !text-rose-500 focus:!ring-1 focus:!ring-rose-500' : ui.input}`}
        />

    );

    const ThemeToggle = ({ themeMode, setThemeMode, isBright }) => (
      <div
        className={`flex items-center p-1 rounded-xl border ${
          isBright ? 'bg-[#E5E3DC] border-stone-300' : 'bg-[#0C0C10] border-white/15'
        }`}
        role="group"
        aria-label="Platform brightness mode"
      >
        <button
          type="button"
          onClick={() => setThemeMode('bright')}

            isBright ? 'bg-zinc-900 text-white shadow-sm' : 'text-zinc-400 hover:text-white'
          }`}
        >
          <Icon name="sun" className="w-3.5 h-3.5" />
          <span>Bright</span>
        </button>
        <button
          type="button"
          onClick={() => setThemeMode('dark')}
          className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
            !isBright ? 'bg-white text-black shadow-sm' : 'text-zinc-700 hover:text-black'
          }`}
        >
          <Icon name="moon" className="w-3.5 h-3.5" />
          <span>Dark</span>
        </button>
      </div>
    );

    const MacroRing = ({ pct, grams, cals, label, ratioText, strokeColor, badgeBg, ui, isBright }) => {
      const r = 34;
      const circ = 2 * Math.PI * r;
      const offset = circ - (pct / 100) * circ;
      return (
        <LuxuryCard ui={ui} className="p-6 flex items-center gap-5">
          <div className="relative w-24 h-24 shrink-0 flex items-center justify-center">
            <svg className="w-24 h-24 -rotate-90" viewBox="0 0 84 84">
              <circle
                cx="42"
                cy="42"
                r={r}
                stroke={isBright ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.1)'}
                strokeWidth="7"
                fill="none"
              />
              <circle
                cx="42"
                cy="42"
                r={r}
                stroke={strokeColor}
                strokeWidth="7"
                strokeDasharray={circ}
                strokeDashoffset={offset}
                strokeLinecap="round"
                fill="none"
              />
            </svg>
            <span className={`absolute text-sm font-bold font-mono ${ui.heading}`}>{pct}%</span>
          </div>
          <div className="space-y-1">
            <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${badgeBg}`}>
              {label}
            </span>
            <div className="flex items-baseline gap-2">
              <span className={`text-3xl font-bold font-mono tabular-nums ${ui.heading}`}>{grams}g</span>
              <span className={`text-xs font-mono ${ui.textMuted}`}>({cals} kcal)</span>
            </div>
            <p className={`text-xs ${ui.textMuted}`}>{ratioText}</p>
          </div>
        </LuxuryCard>
      );
    };

    // ============================================================================
    // PHYSIOLOGICAL & METABOLIC CALCULATIONS
    // ============================================================================
    function estimateHealthyTargetWeightKg(heightCm, currentWeightKg, sex = 'male') {
      const heightM = Math.max(1.0, (heightCm || 175) / 100);
      const weightKg = Math.max(30, currentWeightKg || 75);
      const minHealthyWeight = 18.5 * heightM * heightM;
      const maxHealthyWeight = 24.9 * heightM * heightM;
      const healthyAnchor = (sex === 'female' ? 21.5 : 22.4) * heightM * heightM;

      if (weightKg > maxHealthyWeight) {
        return +Math.min(maxHealthyWeight, healthyAnchor).toFixed(1);
      }
      if (weightKg < minHealthyWeight) {
        return +Math.max(minHealthyWeight, healthyAnchor).toFixed(1);
      }
      return +weightKg.toFixed(1);
    }

    function calculateClientMetrics(client) {
      const heightM = Math.max(1.0, (client.heightCm || 175) / 100);
      const weightKg = Math.max(30, client.weightKg || 75);
      const goalWeightKg = Math.max(30, client.goalWeightKg || weightKg);
      const age = Math.max(14, client.age || 35);
      const isMale = client.sex !== 'female';

      const bmi = +(weightKg / (heightM * heightM)).toFixed(1);
      let bmiCategory = 'Healthy Weight';
      let bmiColor = 'emerald';
      if (bmi < 18.5) {
        bmiCategory = 'Underweight';
        bmiColor = 'sky';
      } else if (bmi >= 25 && bmi < 30) {
        bmiCategory = 'Overweight';
        bmiColor = 'amber';
      } else if (bmi >= 30) {
        bmiCategory = 'Obese';
        bmiColor = 'rose';
      }

      const minHealthyWeight = +(18.5 * heightM * heightM).toFixed(1);
      const maxHealthyWeight = +(24.9 * heightM * heightM).toFixed(1);
      const idealMidWeight = +(22.0 * heightM * heightM).toFixed(1);

      let healthyRangeDelta = 0;
      if (weightKg > maxHealthyWeight) {
        healthyRangeDelta = +(maxHealthyWeight - weightKg).toFixed(1);
      } else if (weightKg < minHealthyWeight) {
        healthyRangeDelta = +(minHealthyWeight - weightKg).toFixed(1);
      }

      const goalDeltaKg = +(goalWeightKg - weightKg).toFixed(1);
      const rate = client.weeklyTargetRateKg || 0;
      let weeksToGoal = 0;
      if (Math.abs(goalDeltaKg) > 0.05) {
        const effectiveRate =
          rate !== 0 && Math.sign(rate) === Math.sign(goalDeltaKg)
            ? Math.abs(rate)
            : Math.abs(rate) || 0.5;
        weeksToGoal = Math.max(1, Math.ceil(Math.abs(goalDeltaKg) / effectiveRate));
      }

      const targetDateObj = new Date(2026, 10, 21);
      targetDateObj.setDate(targetDateObj.getDate() + weeksToGoal * 7);
      const formattedTargetDate = targetDateObj.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });

      // U.S. Navy Circumference Body Fat Equation (Neck, Waist, Hip)
      const neck = Math.max(20, client.measurements?.neck || 38);
      const waist = Math.max(40, client.measurements?.waist || 85);
      const hip = Math.max(50, client.measurements?.hip || 98);
      const heightIn = (client.heightCm || 175) / 2.54;
      const neckIn = neck / 2.54;
      const waistIn = waist / 2.54;
      const hipIn = hip / 2.54;

      let navyBf = 18;
      if (isMale) {
        const denom =
          1.0324 -
          0.19077 * Math.log10(Math.max(1, waistIn - neckIn)) +
          0.15456 * Math.log10(Math.max(1, heightIn));
        navyBf = 495 / Math.max(0.5, denom) - 450;
      } else {
        const denom =
          1.29579 -
          0.35004 * Math.log10(Math.max(1, waistIn + hipIn - neckIn)) +
          0.221 * Math.log10(Math.max(1, heightIn));
        navyBf = 495 / Math.max(0.5, denom) - 450;
      }
      navyBf = +Math.max(4, Math.min(50, navyBf)).toFixed(1);

      const estimatedBf = navyBf;
      const fatMassKg = +((weightKg * estimatedBf) / 100).toFixed(1);
      const leanMassKg = +(weightKg - fatMassKg).toFixed(1);

      let bfCategory = 'Fitness';
      if (isMale) {
        if (estimatedBf < 6) bfCategory = 'Essential';
        else if (estimatedBf <= 13) bfCategory = 'Athletic';
        else if (estimatedBf <= 17) bfCategory = 'Fitness';
        else if (estimatedBf <= 24) bfCategory = 'Average';
        else bfCategory = 'Elevated';
      } else {
        if (estimatedBf < 14) bfCategory = 'Essential';
        else if (estimatedBf <= 20) bfCategory = 'Athletic';
        else if (estimatedBf <= 24) bfCategory = 'Fitness';
        else if (estimatedBf <= 31) bfCategory = 'Average';
        else bfCategory = 'Elevated';
      }

      // Metabolic Engine
      const mifflinBmr = Math.round(
        10 * weightKg + 6.25 * (client.heightCm || 175) - 5 * age + (isMale ? 5 : -161)
      );
      const katchBmr = Math.round(370 + 21.6 * leanMassKg);
      const bmr = client.useKatchMcArdle ? katchBmr : mifflinBmr;

      const steps = client.dailySteps || 7500;
      const neat = Math.max(180, Math.round(steps * 0.042 * (weightKg / 75)));
      const sessions = client.trainingSessionsPerWeek || 0;
      const sessionMins = client.avgSessionMins || 60;
      const tea = Math.round((sessions * sessionMins * 6.5 * (weightKg / 75)) / 7);

      const baseActive = bmr + neat + tea;
      const tef = Math.round(baseActive * 0.1);
      const tdee = Math.round(bmr + neat + tea + tef);

      const adjPct = client.calorieAdjustmentPct || 0;
      const targetCalories = Math.max(1100, Math.round(tdee * (1 + adjPct / 100)));

      // Precision Macros
      let proteinGrams = Math.round(weightKg * 2.0);
      let fatGrams = Math.round((targetCalories * 0.28) / 9);

      if (client.macroPreset === 'athletic') {
        proteinGrams = Math.round((targetCalories * 0.4) / 4);
        fatGrams = Math.round((targetCalories * 0.25) / 9);
      } else if (client.macroPreset === 'balanced') {
        proteinGrams = Math.round((targetCalories * 0.3) / 4);
        fatGrams = Math.round((targetCalories * 0.3) / 9);
      } else if (client.macroPreset === 'low_carb') {
        proteinGrams = Math.round((targetCalories * 0.4) / 4);
        fatGrams = Math.round((targetCalories * 0.4) / 9);
      } else if (client.macroPreset === 'custom') {
        const pPerKg = client.customMacros?.proteinPerKg || 2.1;
        const fPct = (client.customMacros?.fatPercent || 28) / 100;
        proteinGrams = Math.round(weightKg * pPerKg);
        fatGrams = Math.round((targetCalories * fPct) / 9);
      }

      const remainingCals = Math.max(0, targetCalories - proteinGrams * 4 - fatGrams * 9);
      const carbGrams = Math.round(remainingCals / 4);

      const totalMacroCals = Math.max(1, proteinGrams * 4 + carbGrams * 4 + fatGrams * 9);
      const proteinPct = Math.round(((proteinGrams * 4) / totalMacroCals) * 100);
      const fatPct = Math.round(((fatGrams * 9) / totalMacroCals) * 100);
      const carbPct = Math.max(0, 100 - proteinPct - fatPct);

      const fiberGrams = Math.max(25, Math.round((targetCalories / 1000) * 14));
      const waterTargetLiters = +(weightKg * 0.035 + sessions * 0.15).toFixed(1);

      const sortedLogs = [...(client.weightLogs || [])].sort((a, b) =>
        a.date.localeCompare(b.date)
      );
      const startWeight = sortedLogs.length > 0 ? sortedLogs[0].weight : weightKg;
      const totalWeightChange = +(weightKg - startWeight).toFixed(1);
      const weeksElapsed = Math.max(1, sortedLogs.length - 1);
      const weeklyVelocity = +(totalWeightChange / weeksElapsed).toFixed(2);

      return {
        bmi,
        bmiCategory,
        bmiColor,
        minHealthyWeight,
        maxHealthyWeight,
        idealMidWeight,
        healthyRangeDelta,
        goalDeltaKg,
        weeksToGoal,
        formattedTargetDate,
        navyBf,
        estimatedBf,
        fatMassKg,
        leanMassKg,
        bfCategory,
        mifflinBmr,
        katchBmr,
        bmr,
        neat,
        tea,
        tef,
        tdee,
        targetCalories,
        proteinGrams,
        carbGrams,
        fatGrams,
        proteinPct,
        carbPct,
        fatPct,
        fiberGrams,
        waterTargetLiters,
        mealsPerDay: client.mealsPerDay || 4,
        sortedLogs,
        totalWeightChange,
        weeklyVelocity
      };
    }

    // ============================================================================
    // LOGICAL MEAL PARTITIONING HELPER (BREAKFAST, LUNCH, SNACK, DINNER)
    // ============================================================================
    function buildMealPartitionPlan(mealsCount, totalProtein, totalCarbs, totalFats) {
      const templates = {
        3: [
          { name: 'Breakfast', timing: '08:00 • Morning Fuel', pShare: 0.32, cShare: 0.35, fShare: 0.33 },
          { name: 'Lunch', timing: '13:00 • Midday Main', pShare: 0.36, cShare: 0.40, fShare: 0.32 },
          { name: 'Dinner', timing: '19:30 • Evening Recovery', pShare: 0.32, cShare: 0.25, fShare: 0.35 }
        ],
        4: [
          { name: 'Breakfast', timing: '08:00 • Morning Fuel', pShare: 0.28, cShare: 0.30, fShare: 0.28 },
          { name: 'Lunch', timing: '13:00 • Midday Main', pShare: 0.32, cShare: 0.35, fShare: 0.30 },
          { name: 'Afternoon Snack', timing: '16:30 • Pre-Training / Bridge', pShare: 0.12, cShare: 0.15, fShare: 0.12 },
          { name: 'Dinner', timing: '20:00 • Evening Recovery', pShare: 0.28, cShare: 0.20, fShare: 0.30 }
        ],
        5: [
          { name: 'Breakfast', timing: '07:30 • Morning Fuel', pShare: 0.24, cShare: 0.25, fShare: 0.26 },
          { name: 'Morning Snack', timing: '10:30 • Mid-Morning', pShare: 0.11, cShare: 0.12, fShare: 0.12 },
          { name: 'Lunch', timing: '13:30 • Midday Main', pShare: 0.28, cShare: 0.30, fShare: 0.26 },
          { name: 'Afternoon Snack', timing: '17:00 • Pre-Training', pShare: 0.11, cShare: 0.15, fShare: 0.10 },
          { name: 'Dinner', timing: '20:00 • Evening Recovery', pShare: 0.26, cShare: 0.18, fShare: 0.26 }
        ]
      };

      const selected = templates[mealsCount] || templates[4];
      let usedP = 0;
      let usedC = 0;
      let usedF = 0;

      return selected.map((slot, idx) => {
        const isLast = idx === selected.length - 1;
        const p = isLast ? Math.max(0, totalProtein - usedP) : Math.round(totalProtein * slot.pShare);
        const c = isLast ? Math.max(0, totalCarbs - usedC) : Math.round(totalCarbs * slot.cShare);
        const f = isLast ? Math.max(0, totalFats - usedF) : Math.round(totalFats * slot.fShare);
        usedP += p;
        usedC += c;
        usedF += f;
        const kcal = p * 4 + c * 4 + f * 9;
        return { ...slot, protein: p, carbs: c, fats: f, kcal };
      });
    }

      // ============================================================================
      // MODULE 02: BMI & WEIGHT TRAJECTORY PREDICTOR
      // ============================================================================
      const renderBmiPrediction = () => {
        const clampedBmi = Math.max(15, Math.min(38, metrics.bmi));
        const markerPercent = ((clampedBmi - 15) / (38 - 15)) * 100;

        const steps = Math.max(4, Math.min(24, metrics.weeksToGoal || 8));
        const trajPoints = Array.from({ length: steps + 1 }).map((_, idx) => {
          const progress = idx / steps;
          const w = activeClient.weightKg + (activeClient.goalWeightKg - activeClient.weightKg) * progress;
          return { week: Math.round((idx / steps) * (metrics.weeksToGoal || 8)), weight: +w.toFixed(1) };
        });

        const minT = Math.min(activeClient.weightKg, activeClient.goalWeightKg, metrics.minHealthyWeight) - 2;
        const maxT = Math.max(activeClient.weightKg, activeClient.goalWeightKg, metrics.maxHealthyWeight) + 2;
        const rangeT = Math.max(1, maxT - minT);

        const svgW = 480;
        const svgH = 165;
        const padX = 34;
        const padY = 22;

        const polyCoords = trajPoints
          .map((pt, i) => {
            const x = padX + (i / (trajPoints.length - 1)) * (svgW - padX * 2);
            const y = svgH - padY - ((pt.weight - minT) / rangeT) * (svgH - padY * 2);
            return `${x},${y}`;
          })
          .join(' ');

        return (
          <div className="space-y-6">
            <SectionHeader
              number="02"
              title="BMI & Optimal Weight Trajectory Predictor"
              subtitle="Clinical Body Mass Index stratification paired with safe weekly velocity modeling toward the healthy BMI corridor (18.5–24.9)."
              ui={ui}
              isBright={isBright}
            />

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <LuxuryCard ui={ui} highlight className="lg:col-span-7 p-6 flex flex-col justify-between space-y-6">

                    <span className={`text-xs uppercase tracking-widest ${ui.textMuted}`}>
                      Current Body Mass Index
                    </span>
                    <div className="flex items-baseline gap-3 mt-1">
                      <span className={`text-5xl font-bold font-mono tabular-nums ${ui.heading}`}>
                        {metrics.bmi}
                      </span>
                      <span className={`text-sm font-mono ${ui.textMuted}`}>kg/m²</span>
                    </div>
                  </div>
                  <span
                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold border ${
                      metrics.bmiColor === 'emerald'
                        ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/35'
                        : metrics.bmiColor === 'amber'
                        ? 'bg-rose-500/15 text-rose-500 border-rose-500/35'
                        : 'bg-rose-500/15 text-rose-500 border-rose-500/35'
                    }`}
                  >
                    {metrics.bmiCategory}
                  </span>
                </div>
                <p className={`text-[11px] ${ui.textSubtle}`}>
                  Adult reference: healthy BMI 18.5–24.9 kg/m². BMI is a screening measure, not a diagnosis.
                </p>

                <div className="space-y-2.5">
                  <div className={`relative h-4 rounded-full overflow-hidden flex border ${ui.insetStrong}`}>
                    <div style={{ width: '15.2%' }} className="bg-sky-500 h-full" />
                    <div style={{ width: '27.8%' }} className="bg-emerald-500 h-full" />
                    <div style={{ width: '21.7%' }} className="bg-amber-500 h-full" />
                    <div style={{ width: '35.3%' }} className="bg-rose-500 h-full" />
                  </div>
                  <div className="relative h-5">
                    <div
                      style={{ left: `${markerPercent}%` }}
                      className="absolute -translate-x-1/2 flex flex-col items-center transition-all duration-500"
                    >
                      <div
                        className={`w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[8px] ${
                          isBright ? 'border-b-zinc-900' : 'border-b-white'
                        }`}
                      />
                      <span className={`text-[11px] font-mono font-bold mt-0.5 ${ui.heading}`}>
                        {metrics.bmi}
                      </span>
                    </div>
                  </div>
                  <div className={`grid grid-cols-4 text-[11px] ${ui.textMuted}`}>
                    <div className="text-sky-500 font-medium">&lt;18.5 Under</div>
                    <div className="text-emerald-500 font-semibold">18.5–24.9 Healthy</div>
                    <div className="text-amber-500 font-medium">25.0–29.9 Over</div>
                    <div className="text-right text-rose-500 font-medium">30.0+ Obese</div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div className={`p-4 rounded-xl border ${ui.inset}`}>
                    <p className={`text-xs ${ui.textMuted}`}>Healthy Weight Band</p>
                    <p className={`text-base font-bold font-mono mt-1 ${ui.heading}`}>
                      {metrics.minHealthyWeight} – {metrics.maxHealthyWeight} kg
                    </p>
                    <p className={`text-[11px] mt-0.5 ${ui.textSubtle}`}>
                      Midpoint (BMI 22): {metrics.idealMidWeight} kg

                  <div className={`p-4 rounded-xl border ${ui.inset}`}>
                    <p className={`text-xs ${ui.textMuted}`}>To Enter Healthy BMI</p>
                    <p className="text-base font-bold font-mono text-amber-500 mt-1">
                      {metrics.healthyRangeDelta === 0

                      Target: {activeClient.goalWeightKg} kg
                    </p>

              </LuxuryCard>

              <LuxuryCard ui={ui} className="lg:col-span-5 p-6 flex flex-col justify-between space-y-5">

                </div>

                <div className={`rounded-xl p-2 border ${ui.inset}`}>
                  <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-40">
                    <defs>
                      <linearGradient id="traj-vibrant" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stopColor="#06B6D4" />
                        <stop offset="50%" stopColor="#8B5CF6" />
                        <stop offset="100%" stopColor="#10B981" />
                      </linearGradient>
                    </defs>
                    <polyline
                      fill="none"
                      stroke="url(#traj-vibrant)"
                      strokeWidth="3.5"
                      strokeLinecap="round"
                      points={polyCoords}
                    />
                    {trajPoints.map((pt, idx) => {
                      if (idx !== 0 && idx !== trajPoints.length - 1 && idx !== Math.floor(trajPoints.length / 2))
                        return null;
                      const cx = padX + (idx / (trajPoints.length - 1)) * (svgW - padX * 2);
                      const cy = svgH - padY - ((pt.weight - minT) / rangeT) * (svgH - padY * 2);
                      return (
                        <g key={idx}>
                          <circle
                            cx={cx}
                            cy={cy}
                            r="4.5"
                            fill={isBright ? '#FFFFFF' : '#050507'}
                            stroke="#10B981"

                            fontFamily="monospace"
                            fontWeight="bold"

                            x={cx}
                            y={svgH - 4}
                            textAnchor="middle"
                            fill="#71717A"
                            fontSize="9"
                            fontFamily="monospace"
                          >
                            Wk {pt.week}
                          </text>
                        </g>
                      );

                      max="0.75"
                      step="0.05"
                      value={activeClient.weeklyTargetRateKg}

                        updateActiveClient({ weeklyTargetRateKg: parseFloat(e.target.value) })

                      className={`w-full cursor-pointer ${isBright ? 'accent-zinc-900' : 'accent-white'}`}

                  <div className="grid grid-cols-2 gap-3">
                    <div className={`p-3.5 rounded-xl border ${ui.inset}`}>
                      <span className={`text-[11px] ${ui.textMuted}`}>Estimated Duration</span>
                      <p className={`text-xl font-bold font-mono mt-0.5 ${ui.heading}`}>
                        {metrics.weeksToGoal}{' '}

                    <div className={`p-3.5 rounded-xl border ${ui.inset}`}>

      // ============================================================================

      // ============================================================================

        const bmrPct = Math.round((metrics.bmr / metrics.tdee) * 100);
        const neatPct = Math.round((metrics.neat / metrics.tdee) * 100);
        const teaPct = Math.round((metrics.tea / metrics.tdee) * 100);
        const tefPct = Math.max(1, 100 - bmrPct - neatPct - teaPct);

        return (
          <div className="space-y-6">
            <SectionHeader
              number="03"
              title="Metabolic Engine: BMR, TEF, TEA & TDEE"
              subtitle="Granular bioenergetic expenditure modeling combining basal metabolic rate, daily step NEAT, structured training TEA, and thermic effect of food."
              ui={ui}
              isBright={isBright}
              rightContent={
                <button
                  type="button"
                  onClick={() => updateActiveClient({ useKatchMcArdle: !activeClient.useKatchMcArdle })}
                  className={`px-3.5 py-2 rounded-xl text-xs font-semibold border transition-all ${
                    activeClient.useKatchMcArdle ? ui.activePill : ui.secondaryBtn

                  Equation: {activeClient.useKatchMcArdle ? 'Katch-McArdle (LBM)' : 'Mifflin-St Jeor'}

                </p>
                <p className={`text-xs mt-1.5 ${ui.textMuted}`}>Basal Metabolic Rate</p>
              </LuxuryCard>

              <LuxuryCard ui={ui} className="p-5">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-bold uppercase tracking-wider text-cyan-500">NEAT</span>
                  <span className={`text-xs font-mono ${ui.textMuted}`}>{neatPct}% of TDEE</span>
                </div>
                <p className={`text-3xl font-bold font-mono tabular-nums ${ui.heading}`}>
                  {metrics.neat.toLocaleString()}{' '}
                  <span className={`text-xs font-sans font-normal ${ui.textMuted}`}>kcal</span>
                </p>
                <p className={`text-xs mt-1.5 ${ui.textMuted}`}>
                  {activeClient.dailySteps.toLocaleString()} daily steps
                </p>

      const renderWeightProgress = () => {
        const logs = metrics.sortedLogs;
        const emaValues = [];
        logs.forEach((entry, idx) => {
          if (idx === 0) emaValues.push(entry.weight);
          else emaValues.push(+(entry.weight * 0.45 + emaValues[idx - 1] * 0.55).toFixed(2));
        });

        const svgW = 920;
        const svgH = 380;
        const padX = 56;
        const padY = 38;

        const allWeights = [...logs.map((l) => l.weight), activeClient.goalWeightKg];
        const minW = Math.min(...allWeights) - 1.5;
        const maxW = Math.max(...allWeights) + 1.5;
        const rangeW = Math.max(1, maxW - minW);

        const getX = (idx) => {
          if (logs.length <= 1) return svgW / 2;
          return padX + (idx / (logs.length - 1)) * (svgW - padX * 2);
        };

        const getY = (val) => {
          return svgH - padY - ((val - minW) / rangeW) * (svgH - padY * 2);
        };

        const rawPoints = logs.map((l, i) => `${getX(i)},${getY(l.weight)}`).join(' ');
        const emaPoints = emaValues.map((v, i) => `${getX(i)},${getY(v)}`).join(' ');
        const goalY = getY(activeClient.goalWeightKg);

        return (
          <div className="space-y-6">

              number="05"

                  {activeClient.weightKg}{' '}
                  <span className={`text-xs font-sans font-normal ${ui.textMuted}`}>kg</span>
                </p>

                  {metrics.weeklyVelocity > 0 ? `+${metrics.weeklyVelocity}` : metrics.weeklyVelocity}{' '}
                  <span className={`text-xs font-sans font-normal ${ui.textMuted}`}>kg/wk</span>
                </p>
              </LuxuryCard>
            </div>

            {/* Enlarged Weight Progress Graph */}
            <LuxuryCard ui={ui} highlight className="p-6 sm:p-7 space-y-5">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h3 className={`text-lg font-semibold ${ui.heading}`}>
                    Scale Weight vs. Exponential Moving Average (EMA)
                  </h3>
                  <p className={`text-xs ${ui.textMuted}`}>
                    High-resolution longitudinal curve filtering transient water & glycogen fluctuations.

                </div>
                <div className="flex flex-wrap items-center gap-5 text-xs font-medium">

                </div>
              </div>

                <svg
                  viewBox={`0 0 ${svgW} ${svgH}`}

                    isBright ? 'bg-white border-stone-300' : 'bg-[#07070A] border-white/10'

                  {[0.15, 0.35, 0.55, 0.75, 0.9].map((ratio, i) => {

                        <text
                          x={cx}

                          fill={isBright ? '#111827' : '#FFFFFF'}
                          fontSize="11"

                          fontWeight="bold"

                          {l.weight}

                        <text

                <div className="flex flex-nowrap items-center justify-end gap-2 sm:gap-2.5 text-xs shrink-0">
                  <div className={`px-3 py-2 rounded-xl border whitespace-nowrap ${ui.insetStrong}`}>
                    <span className={`block ${ui.textMuted}`}>Current Weight</span>
                    <strong className={`font-mono text-sm ${ui.heading}`}>
                      {activeClient.weightKg} kg
                    </strong>
                  </div>
                  <div className={`px-3 py-2 rounded-xl border whitespace-nowrap ${ui.insetStrong}`}>
                    <span className={`block ${ui.textMuted}`}>Target Weight</span>
                    <strong className="text-emerald-500 font-mono text-sm">
                      {activeClient.goalWeightKg} kg
                    </strong>
                  </div>
                  <div className={`px-3 py-2 rounded-xl border whitespace-nowrap ${ui.insetStrong}`}>
                    <span className={`block ${ui.textMuted}`}>Projected Goal Date</span>
                    <strong className={`text-sm ${ui.heading}`}>{metrics.formattedTargetDate}</strong>
                  </div>
                </div>
              </div>

              {/* 4-Pillar Executive KPI Summary */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className={`p-4 rounded-xl border space-y-1.5 ${ui.inset}`}>
                  <span className={`text-[11px] uppercase tracking-wider ${ui.textMuted}`}>
                    01. BMI & Healthy Corridor
                  </span>
                  <p className={`text-2xl font-bold font-mono ${ui.heading}`}>
                    BMI {metrics.bmi}{' '}
                    <span className="text-xs font-sans font-normal text-cyan-500">
                      ({metrics.bmiCategory})
                    </span>
                  </p>
                  <p className={`text-xs ${ui.textMuted}`}>
                    Band: {metrics.minHealthyWeight}–{metrics.maxHealthyWeight} kg ({metrics.weeksToGoal} wks)
                  </p>
                </div>

                <div className={`p-4 rounded-xl border space-y-1.5 ${ui.inset}`}>
                  <span className={`text-[11px] uppercase tracking-wider ${ui.textMuted}`}>
                    02. Body Fat & Lean Mass
                  </span>
                  <p className="text-2xl font-bold font-mono text-emerald-500">
                    {metrics.estimatedBf}%{' '}
                    <span className={`text-xs font-sans font-normal ${ui.textSecondary}`}>
                      ({metrics.bfCategory})
                    </span>
                  </p>
                  <p className={`text-xs ${ui.textMuted}`}>
                    LBM: {metrics.leanMassKg} kg • Fat: {metrics.fatMassKg} kg
                  </p>
                </div>

                <div className={`p-4 rounded-xl border space-y-1.5 ${ui.inset}`}>
                  <span className={`text-[11px] uppercase tracking-wider ${ui.textMuted}`}>
                    03. Metabolic Bioenergetics
                  </span>
                  <p className="text-2xl font-bold font-mono text-violet-500">
                    {metrics.tdee.toLocaleString()}{' '}
                    <span className={`text-xs font-sans font-normal ${ui.textSecondary}`}>TDEE kcal</span>
                  </p>
                  <p className={`text-xs ${ui.textMuted}`}>
                    BMR {metrics.bmr} • NEAT {metrics.neat} • TEA {metrics.tea} • TEF {metrics.tef}
                  </p>
                </div>

                <div className={`p-4 rounded-xl border space-y-1.5 ${ui.inset}`}>
                  <span className={`text-[11px] uppercase tracking-wider ${ui.textMuted}`}>
                    04. Nutrition & Macros
                  </span>
                  <p className="text-2xl font-bold font-mono text-amber-500">
                    {metrics.targetCalories.toLocaleString()}{' '}
                    <span className={`text-xs font-sans font-normal ${ui.textSecondary}`}>kcal/day</span>
                  </p>
                  <p className={`text-xs ${ui.textMuted}`}>
                    {metrics.proteinGrams}P / {metrics.carbGrams}C / {metrics.fatGrams}F ({metrics.mealsPerDay} meals)
                  </p>
                </div>
              </div>

              {/* Section 5 & 6: Circumferences, Clinical Vitals & Recent Weigh-Ins */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className={`p-5 rounded-2xl border space-y-4 ${ui.inset}`}>
                  <div className={`text-xs font-bold uppercase tracking-wider ${ui.heading}`}>
                    Anthropometric Tape & Clinical Vitals
                  </div>
                  <div className="grid grid-cols-3 gap-2.5 text-xs">
                    <div className={`p-3 rounded-xl border ${ui.card}`}>
                      <span className={`block ${ui.textMuted}`}>Neck / Waist / Hip</span>
                      <strong className={`font-mono ${ui.heading}`}>
                        {activeClient.measurements.neck} / {activeClient.measurements.waist} / {activeClient.measurements.hip} cm
                      </strong>
                    </div>
                    <div className={`p-3 rounded-xl border ${ui.card}`}>
                      <span className={`block ${ui.textMuted}`}>RHR & BP</span>
                      <strong className={`font-mono ${ui.heading}`}>
                        {activeClient.restingHR} bpm • {activeClient.bpSystolic}/{activeClient.bpDiastolic}
                      </strong>
                    </div>
                    <div className={`p-3 rounded-xl border ${ui.card}`}>
                      <span className={`block ${ui.textMuted}`}>Sleep / Stress / H2O</span>
                      <strong className={`font-mono ${ui.heading}`}>
                        {activeClient.sleepHours}h • {activeClient.stressScore}/10 • {activeClient.hydrationLiters}L
                      </strong>
                    </div>
                  </div>
                  <div className={`p-3.5 rounded-xl border text-xs leading-relaxed ${ui.card} ${ui.textSecondary}`}>
                    <strong className={`block mb-1 ${ui.heading}`}>Medical & Orthopedic Profile:</strong>
                    {activeClient.medicalNotes}
                  </div>
                </div>

                <div className={`p-5 rounded-2xl border space-y-4 ${ui.inset}`}>
                  <div className="flex items-center justify-between">
                    <span className={`text-xs font-bold uppercase tracking-wider ${ui.heading}`}>
                      Weight Progress Summary ({metrics.sortedLogs.length} Check-Ins)
                    </span>
                    <span className="text-xs font-mono font-bold text-emerald-500">
                      Delta: {metrics.totalWeightChange > 0 ? `+${metrics.totalWeightChange}` : metrics.totalWeightChange} kg ({metrics.weeklyVelocity} kg/wk)
                    </span>
                  </div>
                  <div className="space-y-1.5 max-h-44 overflow-y-auto pr-1">
                    {[...metrics.sortedLogs].reverse().slice(0, 5).map((log) => (
                      <div
                        key={log.id}
                        className={`flex items-center justify-between text-xs py-1.5 px-3 rounded-lg border ${ui.card}`}
                      >
                        <span className={`font-mono ${ui.textMuted}`}>{log.date}</span>
                        <span className={`font-mono font-bold ${ui.heading}`}>{log.weight} kg</span>
                        <span className={`truncate max-w-[180px] ${ui.textMuted}`}>{log.notes}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Section 7 & 8: Full Training Split & 8-Point Movement Audit */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className={`p-5 rounded-2xl border space-y-3 ${ui.inset}`}>
                  <div className={`flex items-center justify-between text-xs font-bold uppercase tracking-wider ${ui.heading}`}>
                    <span>Training Architecture ({activeClient.trainingSplit.daysPerWeek} Days/Week)</span>
                    <span className={ui.textMuted}>{activeClient.trainingSplit.templateName}</span>
                  </div>
                  <div className="space-y-1.5 pt-1">
                    {activeClient.trainingSplit.schedule.map((s) => (
                      <div
                        key={s.day}
                        className={`flex justify-between gap-3 text-xs py-1.5 border-b ${
                          isBright ? 'border-stone-200' : 'border-white/[0.06]'
                        }`}
                      >
                        <span className={`font-semibold w-24 shrink-0 ${ui.heading}`}>{s.day}</span>
                        <span className={`flex-1 ${ui.textSecondary}`}>{s.focus}</span>
                        <span className="font-mono text-cyan-500 shrink-0">{s.rpe}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className={`p-5 rounded-2xl border space-y-3 ${ui.inset}`}>
                  <div className="flex items-center justify-between">
                    <span className={`text-xs font-bold uppercase tracking-wider ${ui.heading}`}>
                      First-Session Movement Screen
                    </span>
                    <span className="text-xs font-mono font-bold text-emerald-500">
                      {Math.round((totalMovementPts / maxMovementPts) * 100)}% ({totalMovementPts}/{maxMovementPts})
                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    {assessmentItems.map((it) => (
                      <div key={it.label} className={`flex justify-between px-3 py-1.5 rounded-lg border ${ui.card}`}>
                        <span className={ui.textMuted}>{it.label}</span>
                        <span className={`font-mono font-bold ${ui.heading}`}>{it.val}/10</span>
                      </div>
                    ))}
                  </div>
                  <div className={`p-3.5 rounded-xl border text-xs leading-relaxed ${ui.card} ${ui.textSecondary}`}>
                    <strong className={`block mb-1 ${ui.heading}`}>A.FITAMINE Coach Remarks:</strong>
                    {activeClient.assessments.coachNotes}
                  </div>
                </div>
              </div>
            </LuxuryCard>
          </div>
        );
      };

      // ============================================================================
      // MAIN LAYOUT SHELL
      // ============================================================================
      return (
        <div className={`min-h-screen flex flex-col lg:flex-row transition-colors duration-300 ${ui.page}`}>
          {/* LEFT SIDEBAR NAVIGATION (Desktop) */}
          <aside
            className={`hidden lg:flex lg:w-72 lg:flex-col lg:fixed lg:inset-y-0 border-r z-30 transition-colors duration-300 no-print ${ui.shell}`}
          >
            <div className={`p-6 border-b flex items-center gap-3.5 ${ui.divider}`}>
              <div className={`w-11 h-11 rounded-xl border flex items-center justify-center p-1.5 shrink-0 ${ui.logoBadge}`}>
                <AFitamineLogo className="w-8 h-8" variant="white" />
              </div>
              <div>
                <span className={`text-lg font-black tracking-tight uppercase block leading-none ${ui.heading}`}>
                  A.FITAMINE
                </span>
                <span className={`text-[9.5px] uppercase tracking-[0.24em] font-semibold block mt-1 ${ui.textSubtle}`}>
                  COACHING AGENT
                </span>
              </div>
            </div>

            <nav className="flex-1 px-3.5 py-5 space-y-1.5 overflow-y-auto">
              {NAV_ITEMS.map((item) => {
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition-all ${
                      isActive ? ui.activePill : ui.inactivePill
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <Icon name={item.icon} className={`w-4 h-4 ${isActive ? '' : ui.textSubtle}`} />
                      <span>{item.label}</span>
                    </div>
                    <span className={`text-[10px] font-mono ${isActive ? 'opacity-75 font-bold' : ui.textSubtle}`}>
                      {item.badge}
                    </span>
                  </button>
                );
              })}
            </nav>

            <div className={`p-4 m-3.5 rounded-2xl border space-y-2.5 ${ui.card}`}>
              <div className="flex items-center justify-between text-[11px]">
                <span className={ui.textMuted}>Live TDEE</span>
                <span className="font-mono font-bold text-violet-500">{metrics.tdee} kcal</span>
              </div>
              <div className="flex items-center justify-between text-[11px]">
                <span className={ui.textMuted}>Prescribed Intake</span>
                <span className="font-mono font-bold text-emerald-500">{metrics.targetCalories} kcal</span>
              </div>
              <div className="flex items-center justify-between text-[11px]">
                <span className={ui.textMuted}>Estimated Body Fat</span>
                <span className="font-mono font-bold text-cyan-500">{metrics.estimatedBf}%</span>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 lg:pl-72 flex flex-col min-w-0 relative z-10">
            <header className={`sticky top-0 z-20 backdrop-blur-xl border-b px-4 sm:px-8 py-3.5 transition-colors duration-300 no-print ${ui.header}`}>
              <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                {/* Mobile Brand + Menu */}
                <div className="flex items-center gap-2.5 lg:hidden">
                  <button
                    type="button"
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className={`p-2 rounded-xl border ${ui.secondaryBtn}`}
                  >
                    <Icon name={mobileMenuOpen ? 'x' : 'menu'} className="w-5 h-5" />
                  </button>
                  <div className={`w-8 h-8 rounded-lg border flex items-center justify-center p-1 ${ui.logoBadge}`}>
                    <AFitamineLogo className="w-6 h-6" variant="white" />
                  </div>
                  <div className="leading-none">
                    <span className={`text-sm font-black tracking-tight uppercase block ${ui.heading}`}>
                      A.FITAMINE
                    </span>
                    <span className={`text-[8px] uppercase tracking-[0.2em] font-semibold block mt-0.5 ${ui.textSubtle}`}>
                      COACHING AGENT
                    </span>
                  </div>
                </div>

                {/* Client Roster Switcher */}
                <div className="flex items-center gap-2 overflow-x-auto max-w-full py-0.5">
                  {clients.map((client) => {
                    const selected = client.id === activeClient.id;
                    const dirty = Boolean(unsavedIds[client.id]);
                    return (
                      <button
                        key={client.id}
                        type="button"
                        onClick={() => setSelectedClientId(client.id)}
                        className={`flex items-center gap-2.5 px-3.5 py-2 rounded-xl text-xs font-medium transition-all shrink-0 border ${
                          selected ? ui.activePill : `${ui.card} ${ui.textMuted}`
                        }`}
                      >
                        <span
                          className={`w-6 h-6 rounded-lg flex items-center justify-center text-[11px] font-bold ${
                            selected
                              ? isBright
                                ? 'bg-white text-zinc-900'
                                : 'bg-black text-white'
                              : isBright
                              ? 'bg-black/10 text-zinc-900'
                              : 'bg-white/10 text-zinc-200'
                          }`}
                        >
                          {client.avatarInitials}
                        </span>
                        <div className="text-left">
                          <div className="font-bold leading-tight flex items-center gap-1.5">
                            <span>{client.name}</span>
                            {dirty && (
                              <span
                                className="w-2 h-2 rounded-full bg-amber-400 inline-block"
                                title="Unsaved changes"
                              />
                            )}
                          </div>
                          <div
                            className={`text-[10px] font-mono leading-tight ${
                              selected
                                ? isBright
                                  ? 'text-zinc-300'
                                  : 'text-zinc-700'
                                : ui.textSubtle
                            }`}
                          >
                            {client.weightKg} kg • BMI {calculateClientMetrics(client).bmi}
                          </div>
                        </div>
                      </button>
                    );
                  })}

                  <button
                    type="button"
                    onClick={() => setShowNewClientModal(true)}
                    className={`flex items-center gap-1.5 px-3 py-2.5 rounded-xl border border-dashed text-xs font-semibold shrink-0 transition-all ${ui.secondaryBtn}`}
                  >
                    <Icon name="plus" className="w-3.5 h-3.5" />
                    <span>Add Client</span>
                  </button>
                </div>

                {/* Right Controls: Save Client Changes + Theme Toggle */}
                <div className="flex items-center gap-2.5">
                  <button
                    type="button"
                    onClick={handleSaveCurrentClient}
                    className={`flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold border transition-all ${
                      hasUnsavedChanges
                        ? 'bg-emerald-500 hover:bg-emerald-400 text-black border-emerald-400 shadow-sm'
                        : ui.secondaryBtn
                    }`}
                  >
                    <Icon name={hasUnsavedChanges ? 'save' : 'check'} className="w-3.5 h-3.5" />
                    <span>
                      {hasUnsavedChanges
                        ? 'Save Changes'
                        : lastSavedTimestamps[activeClient.id]
                        ? `Saved ${lastSavedTimestamps[activeClient.id]}`
                        : 'Saved'}
                    </span>
                  </button>

                  <ThemeToggle themeMode={themeMode} setThemeMode={setThemeMode} isBright={isBright} />
                </div>
              </div>

              {mobileMenuOpen && (
                <div className={`lg:hidden mt-3 pt-3 border-t grid grid-cols-2 gap-2 ${ui.divider}`}>
                  {NAV_ITEMS.map((item) => {
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => {
                          setActiveTab(item.id);
                          setMobileMenuOpen(false);
                        }}
                        className={`flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs font-semibold ${
                          isActive ? ui.activePill : `${ui.card} ${ui.textMuted}`
                        }`}
                      >
                        <Icon name={item.icon} className="w-4 h-4" />
                        <span>{item.shortLabel}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </header>

            {saveToast && (
              <div className="fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl bg-emerald-500 text-black font-bold text-xs shadow-xl flex items-center gap-2">
                <Icon name="check" className="w-4 h-4" />
                <span>{saveToast}</span>
              </div>
            )}

            <main className="flex-1 px-4 sm:px-8 py-6 sm:py-8 max-w-7xl w-full mx-auto">
              {activeTab === 'biometrics' && renderBiometrics()}
              {activeTab === 'bmi' && renderBmiPrediction()}
              {activeTab === 'metabolic' && renderMetabolicEngine()}
              {activeTab === 'macros' && renderMacroArchitect()}
              {activeTab === 'progress' && renderWeightProgress()}
              {activeTab === 'training' && renderTrainingAndAssessments()}
              {activeTab === 'summary' && renderExecutiveSummary()}
            </main>
          </div>

          {/* ONBOARD NEW CLIENT MODAL */}
          {showNewClientModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <LuxuryCard ui={ui} highlight className="w-full max-w-md p-6 space-y-5">
                <div className={`flex items-center justify-between pb-3 border-b ${ui.divider}`}>
                  <div className="flex items-center gap-2.5">
                    <div className={`w-7 h-7 rounded-lg border flex items-center justify-center p-1 ${ui.logoBadge}`}>
                      <AFitamineLogo className="w-5 h-5" variant="white" />
                    </div>
                    <h3 className={`text-base font-bold ${ui.heading}`}>
                      Onboard New A.FITAMINE Client
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowNewClientModal(false)}
                    className={ui.textMuted}
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleCreateClient} className="space-y-4">
                  <InputField
                    label="Client Full Name"
                    type="text"
                    value={newClientForm.name}
                    onChange={(val) => setNewClientForm({ ...newClientForm, name: val })}
                    ui={ui}
                  />
                  <InputField
                    label="Profession / Executive Role"
                    type="text"
                    value={newClientForm.role}
                    onChange={(val) => setNewClientForm({ ...newClientForm, role: val })}
                    ui={ui}
                  />
                  <div className="grid grid-cols-2 gap-3">
                    <InputField
                      label="Age"
                      unit="yrs"
                      value={newClientForm.age}
                      onChange={(val) => setNewClientForm({ ...newClientForm, age: val })}
                      ui={ui}
                    />
                    <div className="flex flex-col gap-1.5">
                      <label className={`text-xs font-medium ${ui.textMuted}`}>Biological Sex</label>
                      <select
                        value={newClientForm.sex}
                        onChange={(e) => {
                          const nextSex = e.target.value;
                          setNewClientForm((prev) => ({
                            ...prev,
                            sex: nextSex,
                            goalWeightKg: prev.autoEstimateGoal
                              ? estimateHealthyTargetWeightKg(prev.heightCm, prev.weightKg, nextSex)
                              : prev.goalWeightKg
                          }));
                        }}
                        className={`w-full px-3 py-2.5 rounded-xl border text-sm ${ui.input}`}
                      >
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                      </select>
                    </div>
                    <InputField
                      label="Height"
                      unit="cm"
                      value={newClientForm.heightCm}
                      onChange={(val) =>
                        setNewClientForm((prev) => ({
                          ...prev,
                          heightCm: val,
                          goalWeightKg: prev.autoEstimateGoal
                            ? estimateHealthyTargetWeightKg(val, prev.weightKg, prev.sex)
                            : prev.goalWeightKg
                        }))
                      }
                      ui={ui}
                    />
                    <InputField
                      label="Current Weight"
                      unit="kg"
                      step="0.1"
                      value={newClientForm.weightKg}
                      onChange={(val) =>
                        setNewClientForm((prev) => ({
                          ...prev,
                          weightKg: val,
                          goalWeightKg: prev.autoEstimateGoal
                            ? estimateHealthyTargetWeightKg(prev.heightCm, val, prev.sex)
                            : prev.goalWeightKg
                        }))
                      }
                      ui={ui}
                    />
                    <div className="col-span-2 space-y-2">
                      <div className="flex items-center justify-between">
                        <span className={`text-xs font-medium ${ui.textMuted}`}>
                          Target Goal Weight (Healthy BMI 18.5–24.9)
                        </span>
                        <button
                          type="button"
                          onClick={() =>
                            setNewClientForm((prev) => {
                              const nextAuto = !prev.autoEstimateGoal;
                              return {
                                ...prev,
                                autoEstimateGoal: nextAuto,
                                goalWeightKg: nextAuto
                                  ? estimateHealthyTargetWeightKg(prev.heightCm, prev.weightKg, prev.sex)
                                  : prev.goalWeightKg
                              };
                            })
                          }
                          className={`px-2.5 py-1 rounded-lg text-[11px] font-semibold border transition-all ${
                            newClientForm.autoEstimateGoal ? ui.activePill : ui.secondaryBtn
                          }`}
                        >
                          {newClientForm.autoEstimateGoal ? 'Auto-Estimated (Active)' : 'Manual Override'}
                        </button>
                      </div>
                      <InputField
                        label="Estimated Target Weight"
                        unit="kg"
                        step="0.1"
                        value={newClientForm.goalWeightKg}
                        onChange={(val) =>
                          setNewClientForm((prev) => ({
                            ...prev,
                            goalWeightKg: val,
                            autoEstimateGoal: false
                          }))
                        }
                        ui={ui}
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2.5 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowNewClientModal(false)}
                      className={`px-4 py-2 rounded-xl border text-xs ${ui.secondaryBtn}`}
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className={`px-5 py-2 rounded-xl font-bold text-xs ${ui.primaryBtn}`}
                    >
                      Create Client Profile
                    </button>
                  </div>
                </form>
              </LuxuryCard>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
